name: Build and Release Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'manual-build'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: domain-volume-controller/package-lock.json

      - name: Install dependencies
        working-directory: ./domain-volume-controller
        run: npm ci

      - name: Run tests
        working-directory: ./domain-volume-controller
        run: npm test

      - name: Build extension
        working-directory: ./domain-volume-controller
        run: npm run build

      - name: Set version name
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: use the tag name (e.g. v1.2.3)
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.inputs.version || 'manual-build' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Chrome Web Store package
        working-directory: ./domain-volume-controller
        run: |
          cd dist
          zip -r ../domain-volume-controller-${{ steps.version.outputs.name }}.zip . \
            -x "*.map"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension-${{ steps.version.outputs.name }}
          path: domain-volume-controller/domain-volume-controller-${{ steps.version.outputs.name }}.zip

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          files: domain-volume-controller/domain-volume-controller-${{ steps.version.outputs.name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
